<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoNerd</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff5f5;
        --card: #ffffff;
        --text: #1f1f24;
        --muted: #6b7280;
        --primary: #e60023;
        --primary-strong: #bd001d;
        --ring: rgba(230, 0, 35, 0.2);
        --border: #f0d7dc;
        --surface: #fffafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 356px;
        padding: 14px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
        background: radial-gradient(circle at top right, #ffdfe5 0%, var(--bg) 52%);
        color: var(--text);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 12px 36px rgba(148, 13, 41, 0.15);
        animation: enter 220ms ease-out;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: #fff;
        background: linear-gradient(145deg, var(--primary) 0%, var(--primary-strong) 100%);
        box-shadow: 0 8px 16px rgba(230, 0, 35, 0.28);
      }

      .brand-text {
        font-size: 20px;
        line-height: 1;
        font-family: 'Avenir Next', 'Montserrat', 'Poppins', Inter, ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.015em;
        color: #1d1d23;
      }

      .badge {
        font-size: 11px;
        color: var(--primary);
        background: #ffe8ec;
        border: 1px solid #ffd2da;
        border-radius: 999px;
        padding: 3px 8px;
        font-weight: 600;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .field-label {
        display: block;
        font-size: 12px;
        line-height: 1.3;
        font-weight: 600;
        color: #4b5563;
        margin-bottom: 6px;
      }

      .hint {
        margin-top: 5px;
        font-size: 11px;
        line-height: 1.35;
        color: var(--muted);
      }

      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        color: inherit;
        background: var(--surface);
        outline: none;
        transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
      }

      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
        background: #fff;
      }

      .toggle {
        margin: 2px 0 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .toggle-copy {
        display: grid;
        gap: 2px;
      }

      .toggle-copy strong {
        font-size: 13px;
      }

      .toggle-copy span {
        font-size: 11px;
        color: var(--muted);
      }

      .switch {
        appearance: none;
        width: 52px;
        height: 30px;
        border-radius: 999px;
        background: #e4d5d9;
        border: 1px solid #dcb8c0;
        position: relative;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease, box-shadow 140ms ease;
        flex: 0 0 auto;
      }

      .switch:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        transition: transform 180ms ease;
      }

      .switch:checked {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        border-color: #b9001f;
      }

      .switch:checked::after {
        transform: translateX(22px);
      }

      .advanced {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height 230ms ease, opacity 190ms ease;
      }

      .advanced.visible {
        max-height: 240px;
        opacity: 1;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 8px;
      }

      .count {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }

      button {
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.01em;
        padding: 12px 14px;
        cursor: pointer;
        transition: transform 100ms ease, filter 140ms ease;
      }

      button:hover {
        filter: brightness(1.04);
      }

      button:active {
        transform: translateY(1px);
      }

      .status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="card" aria-label="LingoNerd controls">
      <div class="header">
        <div class="brand"><span class="brand-mark">LN</span><span class="brand-text">Lingo Nerd</span></div>
        <span class="badge">Translate</span>
      </div>

      <div class="stack">
        <div>
          <label class="field-label" for="targetLang">Translate into</label>
          <select id="targetLang" aria-label="Target language">
            <option value="pt">Portuguese</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="ja">Japanese</option>
            <option value="de">German</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="scopeSelect">Translation scope</label>
          <select id="scopeSelect" aria-label="Translation scope">
            <option value="all">All visible slides</option>
            <option value="current">Current active slide only</option>
          </select>
          <div class="hint">Use current slide mode for fast iteration while editing.</div>
        </div>

        <div class="toggle">
          <div class="toggle-copy">
            <strong>Additional context</strong>
            <span>Enable to include custom rules before translation.</span>
          </div>
          <input id="advancedToggle" class="switch" type="checkbox" />
        </div>

        <div id="advancedPanel" class="advanced" aria-hidden="true">
          <div class="row">
            <label class="field-label" for="instructionText">Additional context text</label>
            <span id="instructionCount" class="count">0 chars</span>
          </div>
          <textarea
            id="instructionText"
            rows="4"
            maxlength="500"
            placeholder="Example: Keep product names in English and use concise, formal language."
          ></textarea>
        </div>
      </div>

      <button id="translateBtn" type="button">Translate</button>
      <div id="statusText" class="status" aria-live="polite"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
